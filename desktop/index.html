<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mughal E Raj | Desktop Management</title>
<style>
:root {
    --bg: #10090d;
    --panel: #211018;
    --panel2: #2c1620;
    --gold: #e8c47e;
    --gold2: #c99d58;
    --white: #fffaf3;
    --muted: #d7c7ba;
    --line: #65434b;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body {
    color: var(--white);
    font-family: "Segoe UI", Arial, sans-serif;
    background: radial-gradient(ellipse at 50% 0%, #40202b, #160b10 65%, #090608);
}
.tabbar {
    height: 66px;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 18px;
    background: linear-gradient(90deg, #170b11, #29131d);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 5px 18px #0005;
    position: relative;
    z-index: 2;
}
.brand-mini {
    color: var(--gold);
    font-family: Georgia, serif;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 2px;
    white-space: nowrap;
    margin-right: 15px;
}
.tabs { display: flex; align-items: center; gap: 7px; min-width: 0; }
.tab {
    min-width: 112px;
    height: 43px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 13px;
    padding: 0 15px;
    border: 1px solid #68444d;
    border-radius: 9px 9px 0 0;
    background: #28151d;
    color: #f5e9dc;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
}
.tab.active {
    color: #21120f;
    background: linear-gradient(135deg, #f0d18f, #c99d58);
    border-color: #f0d18f;
}
.tab .close {
    font-size: 17px;
    line-height: 1;
    opacity: .8;
    border-radius: 4px;
    padding: 1px 3px;
}
.tab .close:hover { background: #0002; opacity: 1; }
.tab-spacer { flex: 1; }
.top-status {
    color: var(--gold);
    font-size: 10px;
    letter-spacing: 1.5px;
    white-space: nowrap;
}
#homeScreen {
    height: calc(100vh - 66px);
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
}
.container { width: 100%; max-width: 1050px; text-align: center; }
.brand {
    font-family: Georgia, serif;
    font-size: 46px;
    letter-spacing: 6px;
    color: var(--gold);
    font-weight: bold;
}
.brand-subtitle {
    color: #e4d5c2;
    font-size: 12px;
    letter-spacing: 4px;
    margin-top: 12px;
}
.divider {
    width: 75px;
    height: 2px;
    background: var(--gold2);
    margin: 28px auto 40px;
}
.welcome {
    font-family: Georgia, serif;
    font-size: 30px;
    color: #fff;
    margin: 0 0 12px;
}
.description { color: #ded1c5; font-size: 15px; margin: 0 0 42px; }
.dashboards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; }
.dashboard {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 245px;
    padding: 35px 20px;
    background: linear-gradient(145deg, #421e2a, #28121b);
    border: 1px solid #bd9458;
    border-radius: 17px;
    color: white;
    cursor: pointer;
    transition: .25s ease;
    box-shadow: 0 12px 30px #0005;
}
.dashboard:hover {
    transform: translateY(-6px);
    border-color: #f3d18d;
    background: linear-gradient(145deg, #582838, #351622);
    box-shadow: 0 18px 40px #0008;
}
.dashboard-icon { font-size: 46px; color: #edca83; margin-bottom: 22px; }
.dashboard h2 {
    color: white;
    font-family: Georgia, serif;
    font-size: 27px;
    letter-spacing: 2px;
    margin: 0 0 14px;
}
.dashboard p { color: #f0e5da; font-size: 14px; margin: 0; }
.access-label {
    margin-top: 22px;
    font-size: 11px;
    color: #edca83;
    letter-spacing: 2px;
}
.footer { margin-top: 40px; color: #d2c2b1; font-size: 12px; letter-spacing: 1px; }
.status { margin-top: 15px; color: var(--gold); font-size: 11px; }
#dashboardPlaceholder {
    display: none;
    height: calc(100vh - 66px);
    background: #160b10;
}
@media (max-width: 700px) {
    .brand-mini { display: none; }
    .top-status { display: none; }
    .tab { min-width: 90px; padding: 0 9px; }
    #homeScreen { padding: 20px; }
    .dashboards { grid-template-columns: 1fr; }
    .brand { font-size: 30px; letter-spacing: 3px; }
}
</style>
</head>
<body>
    <nav class="tabbar" aria-label="Application tabs">
        <div class="brand-mini">MUGHAL E RAJ</div>
        <div class="tabs" id="tabs">
            <button class="tab active" data-tab="home" type="button">⌂ HOME</button>
        </div>
        <div class="tab-spacer"></div>
        <div class="top-status">RESTAURANT OPERATIONS</div>
    </nav>

    <main id="homeScreen">
        <div class="container">
            <header>
                <div class="brand">MUGHAL E RAJ</div>
                <div class="brand-subtitle">RESTAURANT MANAGEMENT SYSTEM</div>
                <div class="divider"></div>
            </header>

            <section>
                <h1 class="welcome">Welcome Back</h1>
                <p class="description">Select your department to continue</p>
            </section>

            <section class="dashboards">
                <button class="dashboard" type="button" data-open="kitchen">
                    <div class="dashboard-icon">♨</div>
                    <h2>KITCHEN DESK</h2>
                    <p>Orders &amp; Kitchen Preparation</p>
                    <div class="access-label">SECURE STAFF ACCESS</div>
                </button>

                <button class="dashboard" type="button" data-open="billing">
                    <div class="dashboard-icon">▤</div>
                    <h2>BILLING DESK</h2>
                    <p>Orders, Payments &amp; Billing</p>
                    <div class="access-label">SECURE STAFF ACCESS</div>
                </button>
            </section>

            <footer class="footer">
                MUGHAL E RAJ · RESTAURANT OPERATIONS
                <div class="status">INTERNET CONNECTION REQUIRED</div>
            </footer>
        </div>
    </main>

    <section id="dashboardPlaceholder" aria-label="Dashboard workspace"></section>

<script>
const tabsElement = document.getElementById('tabs');
const homeScreen = document.getElementById('homeScreen');
const dashboardPlaceholder = document.getElementById('dashboardPlaceholder');

function renderState(state) {
    const tabs = state.tabs || [];
    tabsElement.innerHTML = '';

    tabs.forEach((tab) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'tab' + (tab.id === state.activeTabId ? ' active' : '');
        button.dataset.tab = tab.id;

        const label = document.createElement('span');
        label.textContent = tab.id === 'home' ? '⌂ HOME' :
            (tab.id === 'kitchen' ? '♨ KITCHEN' : '▤ BILLING');
        button.appendChild(label);

        if (tab.id !== 'home') {
            const close = document.createElement('span');
            close.className = 'close';
            close.textContent = '×';
            close.title = 'Close ' + tab.title + ' tab';
            close.addEventListener('click', (event) => {
                event.stopPropagation();
                window.desktopTabs.closeTab(tab.id);
            });
            button.appendChild(close);
        }

        button.addEventListener('click', () => window.desktopTabs.selectTab(tab.id));
        tabsElement.appendChild(button);
    });

    const onHome = state.activeTabId === 'home';
    homeScreen.style.display = onHome ? 'flex' : 'none';
    dashboardPlaceholder.style.display = onHome ? 'none' : 'block';
}

document.querySelectorAll('[data-open]').forEach((button) => {
    button.addEventListener('click', () => {
        window.desktopTabs.openDashboard(button.dataset.open);
    });
});

window.desktopTabs.onState(renderState);
window.desktopTabs.getState().then(renderState);
</script>
</body>
</html>
